# include ~/.config/kitty/themes/tokyonight/tokyonight_moon.conf
include ~/.config/dotfiles/kitty/themes/catppuccin/kitty/themes/mocha.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

term xterm-kitty

font_size 11.0

confirm_os_window_close 0

enable_audio_bell no

window_padding_width 0

background_opacity 0.9

dynamic_background_opacity yes

shell_integration enabled

clipboard_control write-clipboard write-primary

# Copy common hints selections to the system clipboard instead of pasting them.
map ctrl+shift+o>f kitten hints --type path --program @
map ctrl+shift+o>l kitten hints --type line --program @
map ctrl+shift+o>w kitten hints --type word --program @
map ctrl+shift+o>h kitten hints --type hash --program @

tab_bar_edge top
